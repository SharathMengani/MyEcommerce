<div class="container-fluid bg-success text-white">

    <div class="row">
        <div class="col-md-3">
            <img src="https://media.glassdoor.com/sql/1056482/therightdoctors-squarelogo-1533727516393.png" alt="">
        </div>


        <div class="col-md-6">

            <div class="jumbotron bg-dark ">
                <div class="text-center">
                    <h3>Entry form</h3>
                </div>
                <form #ref="ngForm" (ngSubmit)="onSubmit(ref.value)">
                    <div class="form-group">

                        <label for="d">Id of Person</label>
                        <input type="text" name="personid" class="form-control" id="d" placeholder="Id of person......" ngModel>
                    </div>
                    <div class="form-group">

                        <label for="a">Name</label>
                        <input type="text" name="name" class="form-control" id="a" placeholder="Name......" ngModel>
                    </div>
                    <div class="form-group">
                        <label for="b">Age</label>
                        <input type="number" name="age" class="form-control" id="b" placeholder="Age....." ngModel>
                    </div>

                    <label for="">Gender</label>
                    <div class="form-check" *ngFor="let gender of genders">
                        <label class="form-check-label">
                            <input type="radio" 
                            class="form-check-input" name=gender [value]=gender ngModel  >{{gender}}</label>
                    </div>

                    <div class="form-group">
                        <label for="c">Mobile Number</label>
                        <input type="number" name="number" class="form-control" id="c" placeholder="enter Mobile num....." ngModel>
                    </div>


                    <div class="text-center">
                        <button class="btn btn-success mb-3" type="submit">Submit</button>
                    </div>

                </form>
            </div>

        </div>

    </div>
</div>
